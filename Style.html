<style>
  :root {
    --navy: #1a3d8f;
    --navy-dark: #102759;
    --blue: #2563eb;
    --blue-light: #eaf1ff;
    --white: #ffffff;
    --gray-50: #f7f9fc;
    --gray-100: #eef1f6;
    --gray-300: #d7deea;
    --gray-500: #7a8aa3;
    --gray-700: #3d4a5c;
    --text: #1f2937;
    --ok: #1a9d5c;
    --warn: #b58900;
    --danger: #d9364f;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(16, 39, 89, 0.08), 0 1px 2px rgba(16, 39, 89, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: var(--gray-50);
    color: var(--text);
    margin: 0;
    padding: 0;
    font-size: 14px;
  }

  a { color: var(--blue); }

  .app-header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: var(--white);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .app-header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .app-header .subtitle {
    font-size: 12px;
    color: #c9d7f7;
    margin-top: 2px;
  }

  .container { padding: 16px 20px 32px; }

  .card {
    background: var(--white);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  .kpi-card {
    background: var(--white);
    border: 1px solid var(--gray-100);
    border-left: 4px solid var(--blue);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 14px;
  }
  .kpi-card .kpi-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--gray-500);
    font-weight: 600;
  }
  .kpi-card .kpi-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--navy-dark);
    margin-top: 4px;
  }
  .kpi-card.danger { border-left-color: var(--danger); }
  .kpi-card.warn { border-left-color: var(--warn); }
  .kpi-card.ok { border-left-color: var(--ok); }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    border-bottom: 2px solid var(--gray-100);
    margin-bottom: 16px;
  }
  .tab-btn {
    background: transparent;
    border: none;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-500);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--blue); }
  .tab-btn:hover { color: var(--navy); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: flex-end;
    background: var(--white);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .filter-field { display: flex; flex-direction: column; gap: 3px; }
  .filter-field label { font-size: 10px; color: var(--gray-500); font-weight: 700; text-transform: uppercase; }
  .filter-field select, .filter-field input {
    padding: 6px 8px;
    border: 1px solid var(--gray-300);
    border-radius: 6px;
    font-size: 12px;
    min-width: 120px;
    background: var(--white);
  }

  .btn {
    padding: 7px 14px;
    border-radius: 6px;
    border: none;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--blue); color: var(--white); }
  .btn-primary:hover { background: var(--navy); }
  .btn-ghost { background: var(--gray-100); color: var(--gray-700); }
  .btn-ghost:hover { background: var(--gray-300); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy-dark);
    margin: 0 0 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table th {
    text-align: left;
    background: var(--blue-light);
    color: var(--navy-dark);
    padding: 8px 10px;
    font-weight: 700;
    position: sticky; top: 0;
    cursor: pointer;
    white-space: nowrap;
  }
  table.data-table th:hover { background: #dbe8ff; }
  table.data-table td { padding: 7px 10px; border-bottom: 1px solid var(--gray-100); white-space: nowrap; }
  table.data-table tbody tr:hover { background: var(--gray-50); }
  .table-scroll { max-height: 480px; overflow: auto; border: 1px solid var(--gray-100); border-radius: 8px; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .badge-ok { background: #e3f8ec; color: var(--ok); }
  .badge-warn { background: #fff3cd; color: #8a6d00; }
  .badge-danger { background: #fde3e8; color: var(--danger); }

  .empty-state { text-align: center; color: var(--gray-500); padding: 30px; font-size: 13px; }
  .loading { text-align: center; color: var(--gray-500); padding: 30px; font-size: 13px; }

  .form-wrap { padding: 16px 18px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--gray-700); margin-bottom: 4px; }
  .form-group select, .form-group input, .form-group textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--gray-300);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-banner {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
    display: none;
  }
  .form-banner.show { display: block; }

  .sidebar-wrap { padding: 14px; }
  .sidebar-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--white);
    border: 1px solid var(--gray-100);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 12px;
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy-dark);
    cursor: pointer;
  }
  .sidebar-btn:hover { border-color: var(--blue); background: var(--blue-light); }
  .sidebar-btn .desc { display: block; font-size: 11px; font-weight: 400; color: var(--gray-500); margin-top: 2px; }
</style>
